name: Diadems Hermes candidate

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact reviewed Hermes release commit
        required: true
        default: 06ca11f09bdd08382d89af4331e7a188a339ead3
      upstream_commit:
        description: Exact approved upstream tag commit
        required: true
        default: 29112bef099274229cadff79cdff7bf7b99c4b77
      image_tag:
        description: Candidate image tag (the digest remains authoritative)
        required: true
        default: v2026.8.31-diadems.4

permissions:
  contents: read
  packages: write

concurrency:
  group: diadems-hermes-candidate
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout the exact reviewed patchset
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          path: hermes
          persist-credentials: false

      - name: Verify immutable source and branch composition
        working-directory: hermes
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$UPSTREAM_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git merge-base --is-ancestor "$UPSTREAM_COMMIT" HEAD
          test -n "$(git rev-list "$UPSTREAM_COMMIT..HEAD")"
          test -z "$(git rev-list --merges "$UPSTREAM_COMMIT..HEAD")"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.6"

      - name: Run the Hermes gateway contracts
        working-directory: hermes
        run: |
          uv sync --locked --python 3.13 --extra dev --extra messaging
          scripts/run_tests.sh \
            tests/gateway/test_session_api.py \
            tests/gateway/test_api_server_compaction_projection.py \
            tests/gateway/test_api_server.py \
            tests/gateway/test_api_server_runs.py \
            tests/gateway/test_api_server_run_queue.py \
            tests/gateway/test_api_server_memory_sessions.py \
            tests/gateway/test_api_server_multiplex_secret_scope.py \
            tests/cron/test_automation_memory_policy.py \
            tests/gateway/test_webhook_adapter.py \
            tests/hermes_cli/test_webhook_cli.py \
            tests/agent/test_memory_recall_events.py \
            tests/agent/test_memory_provider.py \
            tests/agent/test_turn_context.py \
            tests/agent/test_secret_scope.py \
            tests/agent/test_cross_process_turn_lease.py \
            tests/test_session_maintenance_active_turns.py \
            tests/tools/test_cronjob_tools.py \
            -q
          if [ -f tests/gateway/test_automation_failure_delivery.py ]; then
            scripts/run_tests.sh \
              tests/gateway/test_automation_failure_delivery.py \
              tests/agent/test_tool_call_guardrail_runtime.py \
              tests/agent/test_turn_finalizer_iteration_limit_exit.py \
              tests/cron/test_failure_delivery_policy.py \
              tests/cron/test_cron_failure_deliver.py \
              tests/gateway/test_warning_notifications.py \
              -q
          fi
          if [ -f tests/tools/test_scoped_vault_live_env.py ]; then
            scripts/run_tests.sh \
              tests/tools/test_scoped_vault_live_env.py \
              tests/tools/test_env_passthrough.py \
              tests/tools/test_skill_env_passthrough.py \
              tests/tools/test_local_env_blocklist.py \
              tests/tools/test_local_env_session_leak.py \
              tests/tools/test_code_kernel.py \
              tests/agent/test_secret_scope.py \
              tests/gateway/test_api_server_multiplex_secret_scope.py \
              -q
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the immutable candidate
        id: image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: hermes
          file: hermes/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/diademstech/hermes-agent:${{ inputs.image_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/DiademsTech/hermes-agent
            org.opencontainers.image.revision=${{ inputs.source_commit }}
            io.diadems.hermes.upstream.revision=${{ inputs.upstream_commit }}
          build-args: |
            HERMES_GIT_SHA=${{ inputs.source_commit }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=diadems-hermes-amd64
          cache-to: type=gha,mode=max,scope=diadems-hermes-amd64

      - name: Record candidate digest
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "### Diadems Hermes candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/diademstech/hermes-agent:${IMAGE_TAG}@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "Record this candidate digest in the private Diadems manifest; approve it only after canary validation." >> "$GITHUB_STEP_SUMMARY"
